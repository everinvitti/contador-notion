<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Contador Notion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="counter-container">
        <h2 id="counter-title">Contador</h2>
        
        <!-- Campo para digitar o número diretamente -->
        <input type="number" id="counter-input" value="0">
        
        <div class="buttons">
            <button id="btn-save">Salvar</button>
            <button id="btn-reset">Zerar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
